  # ==================== Frontend ====================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kayak_frontend
    restart: always
    depends_on:
      user-service:
        condition: service_healthy
      flight-service:
        condition: service_healthy
      hotel-service:
        condition: service_healthy
      car-service:
        condition: service_healthy
      billing-service:
        condition: service_healthy
      admin-service:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      REACT_APP_API_BASE_URL: http://localhost:8001
    networks:
      - kayak_network

volumes:
  mysql_data:
  mongodb_data:
  redis_data:
  zookeeper_data:
  zookeeper_logs:
  kafka_data:

networks:
  kayak_network:
    driver: bridge
